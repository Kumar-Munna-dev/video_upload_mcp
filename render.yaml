# Render: free web service that sleeps when idle and wakes on a request
services:
  - type: web
    name: youtube-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python youtube_mcp.py http
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: API_KEY            # your secret password; the PC sends it
        sync: false
      - key: YOUTUBE_TOKEN_MAIN # whole text of ~/.youtube-mcp/tokens/main.json
        sync: false
      - key: YOUTUBE_TOKEN_PIXELKATHA3D   # ~/.youtube-mcp/tokens/pixelkatha3d.json  (more channels: YOUTUBE_TOKEN_<NAME>)
        sync: false
      - key: YOUTUBE_TOKEN_RIDDLESPIXO    # ~/.youtube-mcp/tokens/riddlespixo.json
        sync: false
      - key: YOUTUBE_TOKEN_SCIELIFEINDIA  # ~/.youtube-mcp/tokens/scielifeindia.json
        sync: false
      - key: SARVAM_API_KEY     # Sarvam AI key, for /voice
        sync: false
