# Render: free web service that sleeps when idle and wakes on a request
services:
  - type: web
    name: youtube-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python youtube_mcp.py http
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: API_KEY            # your secret password; the PC sends it
        sync: false
      - key: YOUTUBE_TOKEN_PIXELKATHA3D   # ~/.youtube-mcp/tokens/pixelkatha3d.json  (more channels: YOUTUBE_TOKEN_<NAME>)
        sync: false
      - key: YOUTUBE_TOKEN_RIDDLESPIXO    # ~/.youtube-mcp/tokens/riddlespixo.json
        sync: false
      - key: YOUTUBE_TOKEN_SCIELIFEINDIA  # ~/.youtube-mcp/tokens/scielifeindia.json
        sync: false
      - key: INSTAGRAM_ACCOUNT_RIDDLESPIXO    # {"user_id": "...", "access_token": "..."}  (more: INSTAGRAM_ACCOUNT_<NAME>)
        sync: false
      - key: INSTAGRAM_ACCOUNT_PIXELKATHA3D
        sync: false
      - key: INSTAGRAM_ACCOUNT_SCIELIFEINDIA
        sync: false
      # Facebook Pages (optional): FACEBOOK_PAGE_<NAME> = {"page_id": "...", "access_token": "<Page token>"}
      - key: META_API_VERSION   # Instagram/Facebook API version; default v27.0, raise it when Meta retires it
        value: v27.0
      - key: SARVAM_API_KEY     # Sarvam AI key, for /voice
        sync: false
